<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<title>Clawd — offline</title>
<style>
  /* Warm-Graphite offline shell. Static, zero JS-chunk references — safe to
     precache forever (it can never go stale against a deploy). */
  :root {
    --canvas: #0c0b0a;
    --surface: #161412;
    --hairline: #2a2624;
    --text-1: #e8e4df;
    --text-3: #8a837b;
    --accent: #d97f4e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text-1);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    padding: 28px 24px;
    text-align: center;
  }
  .glyph {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text-3);
    margin: 0 auto 16px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.01em; }
  p { font-size: 14px; color: var(--text-3); margin: 0 0 20px; }
  button {
    appearance: none;
    border: 1px solid var(--hairline);
    background: transparent;
    color: var(--text-1);
    border-radius: 8px;
    min-height: 44px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  button:active { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <main class="card">
    <div class="glyph" aria-hidden="true"></div>
    <h1>You're offline</h1>
    <p>Clawd can't reach the nerve center. Cached pages may still work; live sessions need a connection.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
