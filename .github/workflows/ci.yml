name: ci

# Unit + integration suites on Linux, macOS and Windows, Node 20 and 22, under both session
# backends: tmux (Linux, macOS) and the built-in terminal, node-pty (everywhere). Playwright e2e
# of the cockpit against the mock server on Linux. No secrets, no model calls (a fake claude).

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      # node-pty is an optional dependency: prebuilt for macOS and Windows, built from source on
      # Linux (the runner has the build tools).
      - name: Install dependencies
        run: npm ci

      - name: Doctor (what a new user sees before init)
        run: node bin/clawdling.js doctor || true

      - name: Tests (tmux backend)
        if: runner.os != 'Windows'
        run: npm run test:tmux

      - name: Tests (pty backend)
        if: ${{ !cancelled() }}
        run: npm run test:pty

  e2e:
    name: e2e · cockpit (Playwright, mock server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run e2e

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test/e2e/test-results
          retention-days: 7
